name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis file proyek
        run: |
          mkdir -p app/src/main/java/com/example/scdownloader
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SCDownloader"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.scdownloader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.scdownloader"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  // Batasi ABI supaya ukuran APK lebih kecil (sebagian besar HP Android modern = arm64)
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

              // Wajib untuk youtubedl-android (binary python/ffmpeg harus diekstrak ke disk)
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")

              // yt-dlp untuk Android
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.4")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.4")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:label="SC Downloader"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/scdownloader/MainActivity.kt <<'EOF_FILE'
          package com.example.scdownloader

          import android.content.ContentValues
          import android.content.Context
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Button
          import androidx.compose.material3.FilterChip
          import androidx.compose.material3.LinearProgressIndicator
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              DownloaderScreen(applicationContext)
                          }
                      }
                  }
              }
          }

          private val FORMATS = listOf("mp3", "m4a", "opus")

          private fun mimeFor(ext: String) = when (ext.lowercase()) {
              "mp3" -> "audio/mpeg"
              "m4a" -> "audio/mp4"
              "opus", "ogg" -> "audio/ogg"
              else -> "audio/*"
          }

          /** Salin file hasil unduhan ke folder Music/SCDownloader agar muncul di pemutar musik. */
          private fun saveToMusic(context: Context, file: File): Boolean {
              val values = ContentValues().apply {
                  put(MediaStore.Audio.Media.DISPLAY_NAME, file.name)
                  put(MediaStore.Audio.Media.MIME_TYPE, mimeFor(file.extension))
                  put(MediaStore.Audio.Media.RELATIVE_PATH, "Music/SCDownloader")
                  put(MediaStore.Audio.Media.IS_PENDING, 1)
              }
              val resolver = context.contentResolver
              val uri = resolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values) ?: return false
              resolver.openOutputStream(uri)?.use { out ->
                  file.inputStream().use { it.copyTo(out) }
              } ?: return false
              values.clear()
              values.put(MediaStore.Audio.Media.IS_PENDING, 0)
              resolver.update(uri, values, null, null)
              return true
          }

          @Composable
          fun DownloaderScreen(context: Context) {
              val scope = rememberCoroutineScope()
              var urls by remember { mutableStateOf("") }
              var format by remember { mutableStateOf("mp3") }
              var busy by remember { mutableStateOf(false) }
              var progress by remember { mutableStateOf(0f) }
              var status by remember { mutableStateOf("Siap. Tempel link SoundCloud di atas.") }
              var ready by remember { mutableStateOf(false) }

              // Inisialisasi yt-dlp + ffmpeg sekali saat layar pertama kali tampil
              remember {
                  scope.launch(Dispatchers.IO) {
                      try {
                          YoutubeDL.getInstance().init(context)
                          FFmpeg.getInstance().init(context)
                          ready = true
                      } catch (e: Exception) {
                          status = "Gagal inisialisasi: ${e.message}"
                      }
                  }
                  true
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  Text("SC Downloader", style = MaterialTheme.typography.headlineMedium)
                  Text(
                      "Gunakan hanya untuk lagu milik sendiri, yang diizinkan diunduh oleh pembuatnya, " +
                          "atau berlisensi bebas.",
                      style = MaterialTheme.typography.bodySmall,
                  )

                  OutlinedTextField(
                      value = urls,
                      onValueChange = { urls = it },
                      label = { Text("Link SoundCloud (satu per baris)") },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = 3,
                      enabled = !busy,
                  )

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      FORMATS.forEach { f ->
                          FilterChip(
                              selected = format == f,
                              onClick = { if (!busy) format = f },
                              label = { Text(f.uppercase()) },
                          )
                      }
                  }

                  Button(
                      onClick = {
                          val list = urls.lines().map { it.trim() }.filter { it.startsWith("http") }
                          if (list.isEmpty()) {
                              status = "Masukkan minimal satu link yang valid."
                              return@Button
                          }
                          busy = true
                          progress = 0f
                          scope.launch {
                              val tmp = File(context.cacheDir, "dl").apply { deleteRecursively(); mkdirs() }
                              val result = withContext(Dispatchers.IO) {
                                  try {
                                      // Unduh satu per satu agar progres jelas
                                      var saved = 0
                                      for ((i, link) in list.withIndex()) {
                                          status = "Mengunduh ${i + 1}/${list.size}…"
                                          val req = YoutubeDLRequest(link).apply {
                                              addOption("-x")
                                              addOption("--audio-format", format)
                                              addOption("--audio-quality", "0")
                                              addOption("--embed-metadata")
                                              addOption("--ignore-errors")
                                              addOption("-o", "${tmp.absolutePath}/%(uploader)s - %(title)s.%(ext)s")
                                          }
                                          YoutubeDL.getInstance().execute(req, null) { p, _, _ ->
                                              progress = (p.coerceIn(0f, 100f)) / 100f
                                          }
                                      }
                                      tmp.listFiles()?.filter { it.extension.equals(format, true) }?.forEach {
                                          if (saveToMusic(context, it)) saved++
                                      }
                                      "Selesai. $saved file tersimpan di Music/SCDownloader."
                                  } catch (e: Exception) {
                                      "Gagal: ${e.message}"
                                  } finally {
                                      tmp.deleteRecursively()
                                  }
                              }
                              status = result
                              busy = false
                          }
                      },
                      enabled = ready && !busy,
                      modifier = Modifier.fillMaxWidth(),
                  ) {
                      Text(if (!ready) "Menyiapkan…" else if (busy) "Mengunduh…" else "Unduh")
                  }

                  if (busy) {
                      LinearProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxWidth())
                  }

                  OutlinedButton(
                      onClick = {
                          busy = true
                          status = "Memperbarui yt-dlp…"
                          scope.launch {
                              val msg = withContext(Dispatchers.IO) {
                                  try {
                                      val r = YoutubeDL.getInstance().updateYoutubeDL(context, YoutubeDL.UpdateChannel.STABLE)
                                      "Pembaruan: $r"
                                  } catch (e: Exception) {
                                      "Gagal memperbarui: ${e.message}"
                                  }
                              }
                              status = msg
                              busy = false
                          }
                      },
                      enabled = ready && !busy,
                      modifier = Modifier.fillMaxWidth(),
                  ) {
                      Text("Perbarui yt-dlp")
                  }

                  Text(status, style = MaterialTheme.typography.bodyMedium)
              }
          }
          EOF_FILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SCDownloader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
